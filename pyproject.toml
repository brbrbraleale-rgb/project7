[tool.poetry]
name = "python-my-project1"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"  # Подняли с 3.10 до 3.11
pandas = "^3.0.1"
openpyxl = "^3.1.5"
pytest = "^8.3.3"
black = "^25.1.0"
isort = "^6.0.0"
requests = "^2.32.5"


[tool.poetry.group.dev.dependencies]
pytest-cov = "^6.0.0"
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = ".git"

[tool.isort]
line_length = 119
force_single_line = true

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = "venv"

[tool.pytest.ini_options]
pythonpath = ["src"]





